pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,ts,mts,cts,jsx,tsx,json,jsonc}"
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    - name: tsc
      glob: "*.{ts,mts,cts,tsx}"
      run: pnpm exec tsc --noEmit

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
